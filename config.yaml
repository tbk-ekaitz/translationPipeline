# Translation Pipeline Configuration

# Yandex Translate API Configuration (for pipeline_excel.py)
yandex:
  api_key: "YOUR_YANDEX_API_KEY"
  folder_id: "YOUR_FOLDER_ID"

# LLM Configuration (for pipeline.py - local models)
llm:
  # Russian translation model (Ollama)
  russian:
    type: "ollama"
    model_name: "hf.co/t-tech/T-pro-it-2.0-GGUF:Q4_K_M"
    base_url: "http://localhost:11434"
    batch_size: 32  # Batch size for Russian translation (adjust based on model size and VRAM)

  # Kazakh translation model (Ollama)
  kazakh:
    type: "ollama"
    model_name: "kazllm-70b"
    base_url: "http://localhost:11434"
    batch_size: 16  # Batch size for Kazakh translation (KazLLM-8B is smaller, can handle larger batches)

# Segmentation configuration
segmentation:
  # Maximum tokens per sentence before splitting
  # Safe values: 3000 for num_ctx=8192, 6000 for num_ctx=16384
  max_tokens: 3000

# Translation prompts (placeholders - replace with your actual prompts)
prompts:
  russian: |
    Вы профессиональный переводчик, специализирующийся на переводах на русский язык. Переведите следующий текст точно, естественно и идиоматично на русский язык. Сохраните смысл, тон и стиль исходного текста. Предоставьте ТОЛЬКО перевод, без пояснений или дополнительного текста.
    Text to translate: {text}

  kazakh: |
    Сіз қазақ тіліне аударуға маманданған кәсіби аудармашысыз. Келесі мәтінді қазақ тіліне (кирилл жазуында) дәл, табиғи және идиоматикалық түрде аударыңыз. Түпнұсқа мәтіннің мағынасын, үнін, мәдени контекстін және стилін сақтаңыз. ТЕК аударманы ұсыныңыз, түсініктемелерсіз немесе қосымша мәтінсіз.
    Text to translate: {text}

# Output configuration
output:
  # Directory for output files
  directory: "./output"

  # Generate both JSON and readable text formats
  formats:
    - "json"
    - "text"
