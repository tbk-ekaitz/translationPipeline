# Translation Pipeline Configuration

# LLM Configuration
llm:
  # Russian translation model (Ollama)
  russian:
    type: "ollama"
    model_name: "hf.co/t-tech/T-pro-it-2.0-GGUF:Q4_K_M"
    base_url: "http://localhost:11434"
    batch_size: 32  # Batch size for Russian translation (adjust based on model size and VRAM)

  # Kazakh translation model (Ollama)
  kazakh:
    type: "ollama"
    model_name: "kazllm-local"
    base_url: "http://localhost:11434"
    batch_size: 48  # Batch size for Kazakh translation (KazLLM-8B is smaller, can handle larger batches)

# Translation prompts (placeholders - replace with your actual prompts)
prompts:
  russian: |
    [PLACEHOLDER: Insert your English to Russian translation prompt here]
    Text to translate: {text}

  kazakh: |
    [PLACEHOLDER: Insert your English to Kazakh translation prompt here]
    Text to translate: {text}

# Output configuration
output:
  # Directory for output files
  directory: "./output"

  # Generate both JSON and readable text formats
  formats:
    - "json"
    - "text"
