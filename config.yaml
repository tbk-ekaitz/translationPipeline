# Translation Pipeline Configuration

# Yandex Translate API Configuration (for pipeline_excel.py)
yandex:
  api_key: "YOUR_YANDEX_API_KEY"
  folder_id: "YOUR_FOLDER_ID"

# LLM Configuration (for pipeline.py - local models)
llm:
  # Russian translation model (T-pro 32B via Ollama - Q8_0 for best quality)
  russian:
    type: "ollama"
    model_name: "hf.co/t-tech/T-pro-it-2.0-GGUF:Q8_0"
    base_url: "http://localhost:11434"
    # 32B model can handle more parallelism
    max_workers: 32
    # Batch sizes by content type (32B model = more headroom)
    batch_size_title: 128    # Titles: short texts, saturate Tensor cores
    batch_size_content: 64   # Paragraphs: up to 3000 tokens, balanced for 96GB

  # Kazakh translation model (KazLLM 70B via Ollama)
  kazakh:
    type: "ollama"
    model_name: "kazllm-70b"
    base_url: "http://localhost:11434"
    # 70B model needs lower parallelism for KV cache
    max_workers: 16
    # Batch sizes by content type (70B model = more conservative)
    batch_size_title: 64     # Titles: short texts, 70B still fits
    batch_size_content: 20   # Paragraphs: 3000 tokens + 70B KV cache balance

# Segmentation configuration
segmentation:
  # Maximum tokens per chunk (hard limit)
  # Safe values: 3000 for num_ctx=8192, 6000 for num_ctx=16384
  max_tokens: 3000

  # Balanced chunking: creates uniform chunk sizes for better parallelism
  balance_batches: true

  # Target chunk size as ratio of max_tokens (0.8 = aim for 80% of max)
  target_ratio: 0.8

  # Weights for cut points (higher = better place to cut)
  # Greedy algorithm prefers cutting at higher-weight points
  cut_weights:
    period: 1.0      # . ! ? - best cut points
    semicolon: 0.7   # ;
    colon: 0.6       # :
    comma: 0.4       # ,
    space: 0.1       # (space) - last resort

# Translation prompts (placeholders - replace with your actual prompts)
prompts:
  russian: |
    Вы профессиональный переводчик, специализирующийся на переводах на русский язык. Переведите следующий текст точно, естественно и идиоматично на русский язык. Сохраните смысл, тон и стиль исходного текста. Предоставьте ТОЛЬКО перевод, без пояснений или дополнительного текста.
    Text to translate: {text}

  kazakh: |
    Сіз қазақ тіліне аударуға маманданған кәсіби аудармашысыз. Келесі мәтінді қазақ тіліне (кирилл жазуында) дәл, табиғи және идиоматикалық түрде аударыңыз. Түпнұсқа мәтіннің мағынасын, үнін, мәдени контекстін және стилін сақтаңыз. ТЕК аударманы ұсыныңыз, түсініктемелерсіз немесе қосымша мәтінсіз.
    Text to translate: {text}

# Output configuration
output:
  # Directory for output files
  directory: "./output"

  # Generate both JSON and readable text formats
  formats:
    - "json"
    - "text"
